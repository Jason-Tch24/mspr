[pytest]
# Dossier(s) où pytest cherche les tests
testpaths = dashboard

# Patterns de collecte
python_files  = test_*.py
python_classes = Test*
python_functions = test_*

# Affichage verbeux par défaut + durée des tests lents
addopts = -v --tb=short

# Les tests script-based (test_simulator.py, test_kpi_engine.py,
# test_alert_engine.py) s'exécutent au niveau module lors de la
# collection ; leurs assertions sont validées en tant que
# CollectionError si elles échouent.
# test_health.py fournit les items pytest formels (def test_*).
